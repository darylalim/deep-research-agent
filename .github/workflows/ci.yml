name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # `--group ui`, unlike `serve`, because that group has FIRST-PARTY code behind it
      # (`deep_research/webui.py`, `streamlit_app.py`). `uv sync` is an exact sync, so a
      # bare one uninstalls the group and `ty` then fails those files with
      # `unresolved-import: streamlit`. `serve` stays out because no module in this repo
      # imports langgraph-cli — there is nothing there for lint or ty to check.
      - name: Install dependencies
        run: uv sync --group ui
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format check
        run: uv run ruff format --check
      - name: Type check (ty)
        run: uv run ty check

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # `--group ui` so `tests/test_webui.py` actually RUNS here rather than skipping.
      # It guards its import with `pytest.importorskip("streamlit")`, which keeps a
      # partial install working locally — but a suite that silently skips in CI is a
      # suite that is not protecting anything.
      - name: Install dependencies
        run: uv sync --group ui
      # Runs the offline suite only; `live` tests are deselected by default, so
      # no ANTHROPIC_API_KEY / TAVILY_API_KEY secrets are needed here.
      - name: Run tests
        run: uv run pytest
