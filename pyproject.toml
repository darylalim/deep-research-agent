[project]
name = "deep-research-agent"
# Read from `deep_research/__init__.py` — see `[tool.hatch.version]` below. The
# version used to be duplicated here AND there, and now that releases are tagged
# there would be a third copy (the git tag) to keep in step. One source, two
# readers: `deep_research.__version__` at runtime and `importlib.metadata` for the
# installed distribution.
dynamic = ["version"]
description = "A persistent, subagent-orchestrating research agent built on Deep Agents (LangChain + LangGraph)."
readme = "README.md"
# PEP 639 form: an SPDX expression, not the legacy `{text = ...}` table or a
# `License ::` classifier (both deprecated). `license-files` makes hatchling copy
# LICENSE into the wheel's `.dist-info/licenses/`, so the grant travels with the
# artifact and not just with the repo. MIT matches the whole upstream stack —
# deepagents, langchain, and langgraph are all MIT.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4.0"
dependencies = [
    # Deep Agents harness (bundles langgraph transitively).
    # Capped at the MINOR: deepagents is 0.x, so a minor bump is its breaking boundary.
    # Everything else here is capped at the major, matching the LangChain 1.0 LTS line.
    #
    # **The 0.6 -> 0.7 crossing is the reason that cap is not cosmetic.** Two of its
    # changes are invisible to `ty`, to lint, and — this is the part worth remembering —
    # to the entire offline suite, which passed 202/202 on 0.7.8 with BOTH defects live.
    # Measured by building `build_agent()` and listing the tool node:
    #
    #   0.6.12: [edit_file, execute, glob, grep, ls, read_file, task, tavily_search,
    #            write_file, write_todos]
    #   0.7.8:  [delete, edit_file, execute, glob, grep, ls, read_file, task,
    #            tavily_search, write_file]
    #
    # 1. `write_todos` GONE — 0.7.x drops `TodoListMiddleware` from the base stack, so
    #    `SYSTEM_PROMPT` step 1 would order a tool the model is never offered and
    #    `plans_with_todos` would score zero for a reason having nothing to do with the
    #    agent. `agent.py` now passes `middleware=[TodoListMiddleware()]`, which is only
    #    correct on 0.7+: on 0.6.x it registered a SECOND `write_todos` (no dedupe).
    # 2. `delete` APPEARED, ungated — an unreviewed filesystem mutation reachable on
    #    `/memories/`, the one place this agent's writes are durable. Now in
    #    `GATED_TOOLS`.
    #
    # The lasting fix is neither of those, it is
    # `test_every_mutating_tool_the_model_is_offered_is_gated`: it derives the check from
    # the BUILT AGENT's tool list, so an unclassified tool arriving from any future
    # upgrade fails instead of passing. Every test that missed this asked what the source
    # *says* rather than what the model is *handed*. Keep the floor at 0.7.8 and above.
    "deepagents>=0.7.8,<0.8",
    # LangChain 1.0 LTS core + framework
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    # Anthropic provider (Claude models)
    "langchain-anthropic>=1.0,<2.0",
    # Web search tool for research (dedicated partner package)
    "langchain-tavily>=0.2,<1.0",
    # Orchestration runtime + disk-backed checkpointer for HITL/persistence
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    # Observability
    "langsmith>=0.3,<1.0",
    # Load .env into the environment
    "python-dotenv>=1.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Floored, for the same reason `ty` is: the *repo* depends on this version's
    # behavior, not merely on "some ruff". Every checked-in file is 0.16's formatter
    # output and CI runs `ruff format --check`, so an older ruff fails on files nobody
    # touched. No upper cap — see the note under `ty`; the same reasoning applies, and
    # the formatter's output is re-checked by CI on every run anyway, so a break is
    # loud rather than silent.
    "ruff>=0.16",
    # Floor raised from 0.0.58 because the *source* now depends on the fix. ty 0.0.63
    # models Pydantic `populate_by_name`, so `ChatAnthropic(model=..., max_tokens=...)`
    # type-checks without help and the three `ty: ignore`s that `config.py::build_model`
    # used to carry (plus the one in `evals/evaluators.py`) were deleted — a dead
    # directive is itself a `ty check` failure, `unused-ignore-comment`. Measured on one
    # `langchain-anthropic` build: 0.0.58 reports three errors there, 0.0.63 none. With
    # an older ty this repo no longer type-checks, so the floor is a real requirement,
    # not hygiene.
    #
    # **No upper cap, and that is a decision rather than an oversight** — it has been
    # raised once in review already. The 0.x caps elsewhere in this file (`deepagents`,
    # `langgraph-cli`) bound things that ship INTO the app, where a surprise resolution
    # changes runtime behavior. These two are developer tools: `uv.lock` pins them
    # exactly, so CI and every `uv sync` are already deterministic, and the only exposure
    # is an install that bypasses the lock. Capping a `0.0.x` tool at its real breaking
    # boundary would mean `<0.0.64` and an edit per release, which buys churn, not safety.
    "ty>=0.0.63",
]
# The `langgraph dev` server (the Studio / deep-agents-ui front door — see
# `deep_research/graph.py`). Its OWN group, deliberately NOT in the default set, so
# the lint/test CI jobs' bare `uv sync` stays lean and never pulls the server stack
# (langgraph-api, uvicorn, opentelemetry, …) it does not use. Run it with
# `uv run --group serve langgraph dev`, which installs the group on demand.
# Capped at the minor: langgraph-cli is 0.x, so a minor bump is its breaking
# boundary, and an unbounded `>=` could pull a langgraph-api requiring langgraph>=2,
# which cannot resolve against this project's `langgraph>=1.0,<2.0` runtime cap.
serve = [
    "langgraph-cli[inmem]>=0.4.31,<0.5",
]
# The browser front door (`streamlit run streamlit_app.py` → `deep_research/webui.py`).
# Its own group like `serve`, and out of the default set for the same reason: a bare
# `uv sync` should not drag pandas, pyarrow and numpy into an install that only wants the
# agent. Run it with `uv run --group ui streamlit run streamlit_app.py`.
#
# **Unlike `serve`, CI installs this one** (`.github/workflows/ci.yml` syncs
# `--group ui` in its `lint` and `test` jobs). The difference is first-party code: nothing in this repo
# imports langgraph-cli, so there is nothing for lint/ty/pytest to check in `serve` —
# whereas `webui.py` and `streamlit_app.py` are ours, and without the group `ty` fails
# them with `unresolved-import` and `tests/test_webui.py` skips itself.
#
# Capped at the major: streamlit is 1.x and stable there. The >=1.57 floor is what ships
# the bundled agent-skill docs under `streamlit/.agents/`, and `st.code(height=...)` /
# `st.chat_input(submit_mode=...)`, both of which `webui.py` uses.
ui = [
    "streamlit>=1.57,<2.0",
]

# The single source of the project's version: hatchling greps this file for a
# `__version__ = "..."` assignment at build time and uses it for `[project].version`,
# which is declared `dynamic` above. Bump `deep_research/__init__.py` and the wheel,
# `importlib.metadata.version("deep-research-agent")`, and `deep_research.__version__`
# all move together — then tag `v<that value>`.
[tool.hatch.version]
path = "deep_research/__init__.py"

# The distribution name (deep-research-agent) differs from the import package
# (deep_research), so point hatchling at the right directory for the wheel.
# `evals` rides along not because it belongs in the wheel — nothing imports it at
# runtime — but because the editable install is what puts it on `sys.path`, and
# without that neither `python -m evals` nor `tests/test_evals.py` can import it.
[tool.hatch.build.targets.wheel]
packages = ["deep_research", "evals"]

[tool.ruff.lint]
# Ruff's defaults are only E4/E7/E9 + F. Widen to catch import order (I),
# outdated idioms (UP), likely bugs (B), needless complexity (SIM), dead `noqa`
# directives (RUF100), and blind excepts (BLE) — the last of these is what makes
# the deliberate suppression in `cli.py` an enforced decision rather than a
# decorative comment. `target-version` is inferred from `requires-python`.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]
# The formatter owns line length; E501 would only ever fire on prose it won't rewrap.
ignore = ["E501"]

[tool.pytest.ini_options]
# `deep_research` imports without a sys.path shim because the project itself is
# installed (editable) into the venv by `uv sync`.
testpaths = ["tests"]
# `live` tests hit real Anthropic/Tavily APIs — opt in with `pytest -m live`.
addopts = "-m 'not live'"
markers = [
    "live: exercises real external APIs (needs keys + network); deselected by default",
]
